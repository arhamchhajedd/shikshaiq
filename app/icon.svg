<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shikshaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="100%" stop-color="#171717" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle (Apple style) -->
  <rect width="512" height="512" rx="112" fill="url(#shikshaGrad)" />
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#333333" stroke-width="3" />
  
  <!-- Geometric math symbol & monogram -->
  <g transform="translate(256, 230)" text-anchor="middle">
    <!-- Division / Fraction Bar -->
    <rect x="-90" y="-12" width="180" height="24" rx="12" fill="#ffffff" />
    <!-- Numerator Dot / Symbol -->
    <circle cx="0" cy="-70" r="30" fill="#ffffff" />
    <!-- Denominator Dot / Symbol -->
    <circle cx="0" cy="70" r="30" fill="#ffffff" />
  </g>
  
  <!-- Brand Name Typography -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="52" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1.5">
    Shiksha<tspan fill="#a3a3a3">IQ</tspan>
  </text>
</svg>
